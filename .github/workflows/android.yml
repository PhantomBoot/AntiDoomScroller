name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Two runs finishing together would both delete and recreate the "latest" release, leaving a
# window where the download link 404s. One run per branch, newest wins.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package set includes the long-obsolete "tools" package, which
          # no longer resolves; ask for exactly what this build needs instead.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run the core test suite
        run: ./gradlew :core:test --no-daemon

      - name: Build the app
        env:
          ADS_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Name the APK after its version
        run: |
          mkdir -p dist
          # Read the version Gradle actually stamped, rather than recomputing it here and
          # risking the two drifting apart.
          VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/debug/output-metadata.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/antidoomscroller-$VERSION.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: antidoomscroller-apk
          path: dist/*.apk
          if-no-files-found: error

      # A release per build, kept. Nothing is deleted and no file is overwritten, so an older
      # version stays installable if a new one turns out to be worse.
      - name: Publish this build
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "dist/antidoomscroller-$VERSION.apk" \
            --title "AntiDoomScroller $VERSION" \
            --target "${GITHUB_SHA}" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA:0:7}\`.

          Download \`antidoomscroller-$VERSION.apk\` below and open it on your phone. It installs over an older build as an update and keeps your settings."
