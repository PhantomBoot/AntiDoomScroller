name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run the core test suite
        run: ./gradlew :core:test --no-daemon

      - name: Build the app
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/antidoomscroller.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: antidoomscroller-apk
          path: dist/antidoomscroller.apk
          if-no-files-found: error

      - name: Publish a release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/antidoomscroller.apk \
            --title "AntiDoomScroller ${GITHUB_REF_NAME}" \
            --notes "Install on your phone: download antidoomscroller.apk below, open it, and allow installing from this source when Android asks."

      - name: Publish the latest build from the default branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/antidoomscroller.apk \
            --title "Latest build" \
            --prerelease \
            --notes "Rebuilt from main on every push. Download antidoomscroller.apk below and open it on your phone."
